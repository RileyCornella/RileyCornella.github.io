
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV | Riley Cornella</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f7f5ef;
      color: #302d26;
      font-family: Garamond, Georgia, serif;
    }

    /* Header */
    .header {
      background: #59634c;
      padding: 20px 5%;
      color: #d9c9a8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 40px;
      margin: 0;
      color: #d9c9a8;
    }

    /* Navigation */
    .header a,
    .header a:visited,
    .header a:active,
    .header a:hover {
      color: #d9c9a8;
      text-decoration: none;
      margin-left: 30px;
      font-size: 22px;
      font-weight: bold;
    }

    /* Main content */
    .content {
      max-width: 1000px;
      width: 100%;
      box-sizing: border-box;
      margin: 40px auto;
      padding: 0 25px;
      flex: 1;
    }

    iframe {
      width: 100%;
      height: 900px;
      border: 1px solid #ddd;
      margin-top: 20px;
    }

    /* Mobile layout */
    @media (max-width: 600px) {
      .header {
        padding: 20px 5%;
      }

      .header h1 {
        font-size: 30px;
      }

      .header a,
      .header a:visited,
      .header a:active,
      .header a:hover {
        font-size: 22px;
        margin-left: 15px;
      }

      .content {
        padding: 0 20px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Curriculum Vitae</h1>
    <div>
      <a href="index.html">Home</a>
      <a href="CV.html">CV</a>
    </div>
  </div>

  <div class="content">
    <iframe src="CV.pdf" title="Riley Cornella CV"></iframe>
  </div>

</body>
</html>

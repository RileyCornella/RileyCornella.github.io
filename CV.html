
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV | Riley Cornella</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #f7f5ef;
      color: #302d26;
      font-family: Garamond, Georgia, serif;
      font-size: 20px;
      line-height: 1.6;
    }

    /* Header */
    .header {
      background-color: #59634c;
      height: 100px;
      width: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 40px;
      font-weight: 600;
      margin: 0;
      color: #f7f5ef;
      text-align: center;
    }

    /* Navigation - matches Home page */
    .nav {
      position: absolute;
      top: 20px;
      right: 5%;
      display: flex;
      gap: 30px;
      align-items: center;
    }

    .nav a,
    .nav a:visited,
    .nav a:active,
    .nav a:hover {
      color: #f7f5ef;
      text-decoration: none;
      font-family: Garamond, Georgia, serif;
      font-size: 22px;
      font-weight: bold;
      line-height: 1;
    }

    /* Main content */
    .content {
      max-width: 1000px;
      width: 100%;
      box-sizing: border-box;
      margin: 40px auto;
      padding: 0 30px;
      flex: 1;
    }

    /* CV PDF */
    iframe {
      width: 100%;
      height: 900px;
      border: 1px solid #ddd;
      margin-top: 20px;
    }

    /* Mobile layout */
    @media (max-width: 600px) {
      .header {
        height: 80px;
      }

      .header h1 {
        font-size: 30px;
      }

      .nav {
        gap: 18px;
        right: 5%;
      }

      .nav a,
      .nav a:visited,
      .nav a:active,
      .nav a:hover {
        font-size: 22px;
      }

      .content {
        padding: 0 20px;
      }
    }
  </style>
</head>

<body>

  <!-- Green header and navigation -->
  <div class="header">

    <h1>Curriculum Vitae</h1>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="CV.html">CV</a>
    </div>

  </div>

  <!-- Main content -->
  <div class="content">

    <iframe src="CV.pdf" title="Riley Cornella CV"></iframe>

  </div>

</body>
</html>
